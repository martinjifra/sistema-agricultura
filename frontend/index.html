<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SISTEMA DE AGRICULTURA</title>

  <!-- Cargar Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body>

  <section class="min-h-screen bg-[#eee] p-0.5 sm:p-2">

    <div class="mx-auto min-h-[calc(100vh-8px)] max-w-[1400px] overflow-hidden rounded-md bg-white shadow-sm">

      <div class="grid min-h-[calc(100vh-8px)] grid-cols-1 md:grid-cols-2">

        <!-- COLUMNA IZQUIERDA: FORMULARIO -->
        <div class="flex items-center justify-center bg-white px-6 py-10 sm:px-12 lg:px-16 xl:px-[90px]">

          <div class="w-full max-w-[400px]">

            <!-- Logo y título -->
            <div class="mb-[68px] flex flex-col items-center text-center">

              <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/lotus.webp" alt="Logo"
                class="mb-7 w-[185px] object-contain">

              <h4 class="mt-1 text-[28px] font-semibold leading-tight text-[#333]">
                SISTEMA DE AGRICULTURA
              </h4>

            </div>

            <form>

              <p class="mb-6 text-[20px] text-[#333]">
                Inicia sesión en tu cuenta
              </p>

              <!-- Usuario -->
              <div class="mb-[30px]">

                <input type="email" id="form2Example11" placeholder="Nombre de usuario"
                  class="h-[45px] w-full rounded-[5px] border border-[#bdbdbd] bg-white px-[14px] text-[18px] text-[#333] outline-none transition placeholder:text-[#666] focus:border-[#b44593] focus:ring-1 focus:ring-[#b44593]">

              </div>

              <!-- Contraseña -->
              <div class="mb-[34px]">

                <input type="password" id="form2Example22" placeholder="Contraseña"
                  class="h-[45px] w-full rounded-[5px] border border-[#bdbdbd] bg-white px-[14px] text-[18px] text-[#333] outline-none transition placeholder:text-[#666] focus:border-[#b44593] focus:ring-1 focus:ring-[#b44593]">

              </div>

              <!-- Botón de inicio de sesión -->
              <div class="mb-6">

                <button type="button"
                  class="h-[45px] w-full rounded-[5px] bg-gradient-to-r from-[#ee7724] via-[#d8363a] to-[#b44593] text-[14px] font-medium text-white shadow-[0_4px_12px_rgba(0,97,148,0.25)] transition hover:brightness-110 active:scale-[0.99]">
                  iniciar sesión
                </button>

              </div>

              <!-- Recuperar contraseña -->
              <div class="mb-[68px] text-center">

                <a href="#!" class="text-[18px] text-[#666] transition hover:text-[#b44593] hover:underline">
                  ¿Olvidaste tu contraseña?
                </a>

              </div>

              <!-- Crear cuenta -->
              <div class="flex items-center justify-between gap-4">

                <p class="max-w-[150px] text-[20px] leading-8 text-[#333]">
                  ¿No tienes una cuenta?
                </p>

                <button type="button"
                  class="min-h-[67px] w-[145px] shrink-0 rounded-[5px] border-2 border-[#d83655] px-4 py-2 text-[14px] font-medium leading-[22px] text-[#d83655] transition hover:bg-[#d83655] hover:text-white">
                  CREAR<br>CUENTA
                </button>

              </div>

            </form>

          </div>

        </div>


        <!-- COLUMNA DERECHA: IMAGEN DE AGRICULTURA -->
        <div class="relative min-h-[350px] overflow-hidden md:min-h-full">

          <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef"
            alt="Paisaje de agricultura con campos de cultivo"
            class="absolute inset-0 h-full w-full object-cover object-center">

        </div>
      </div>

    </div>

  </section>

</body>

</html>
